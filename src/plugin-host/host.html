<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      仲介の iframe の中身（ADR-005 の R8）。本体が、sandbox="allow-scripts" の iframe の srcdoc に入れる（このファイルを ?raw で取り込む）。
      srcdoc の文脈は、本体の CSP を継承する。この meta の CSP は、それをさらに狭める（両方を満たしたものだけが通る）。
      仲介のコード（relay.js）だけを、本体と同じオリジンの決まったパスから読み、Worker は blob だけ。接続、画像、フレームなどはすべて拒否する。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src blob:; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>plugin host</title>
  </head>
  <body>
    <script src="/plugin-host/relay.js"></script>
  </body>
</html>
