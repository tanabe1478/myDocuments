name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/docio

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: cargo test (docio)
        run: cargo test --manifest-path crates/docio/Cargo.toml

      - name: cargo test (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          # 本物のゴミ箱へ移すテストは、CI でだけ動かす（手元のゴミ箱を汚さないため）。
          IME_TEST_REAL_TRASH: '1'

      - name: cargo test (src-tauri, isolation-probe feature)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features isolation-probe
        env:
          IME_TEST_REAL_TRASH: '1'

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: tauri build (debug, no bundle)
        run: npx tauri build --debug --no-bundle

      - name: Production bundle must not contain the e2e memory bridge
        run: |
          if grep -rlE "__mdeE2E|__E2E_SEED__" dist; then
            echo "e2e code found in the production bundle" >&2
            exit 1
          fi

      # 隔離の検証用のコード（VITE_ISOLATION_PROBE=1 のビルドだけ）、段 2 のテスト用の部品（__mdeE2EActionFixture は上の検査でも見る）、
      # ブラウザ版だけが配信する Worker のホストのファイル（Tauri 版は plug: から返す）は、本番の dist に入らない。
      - name: Production bundle must not contain the isolation probe or the test action plugins
        run: |
          if grep -rlE "__mdeIsolationProbe|isolation_probe_|__mdeE2EActionFixture" dist; then
            echo "isolation probe or test plugin code found in the production bundle" >&2
            exit 1
          fi
          if [ -e dist/plug ]; then
            echo "plug/ must not be emitted in the production bundle" >&2
            exit 1
          fi

      - name: Phase 0 consistency check
        run: node scripts/check-phase0.mjs
