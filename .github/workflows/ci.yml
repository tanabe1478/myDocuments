name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/docio

      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: cargo test (docio)
        run: cargo test --manifest-path crates/docio/Cargo.toml

      - name: cargo test (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          # 本物のゴミ箱へ移すテストは、CI でだけ動かす（手元のゴミ箱を汚さないため）。
          IME_TEST_REAL_TRASH: '1'

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: tauri build (debug, no bundle)
        run: npx tauri build --debug --no-bundle

      - name: Production bundle must not contain the e2e memory bridge
        run: |
          if grep -rlE "__mdeE2E|__E2E_SEED__" dist; then
            echo "e2e code found in the production bundle" >&2
            exit 1
          fi

      - name: Phase 0 consistency check
        run: node scripts/check-phase0.mjs
